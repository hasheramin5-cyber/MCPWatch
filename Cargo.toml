[package]
name = "mcpwatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Audit local Model Context Protocol (MCP) configurations before connecting them to AI coding agents."
license = "MIT"
readme = "README.md"
keywords = ["mcp", "security", "audit", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mcpwatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
